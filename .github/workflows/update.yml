name: Actualizar NAIRU & PIB Potencial

# ── Triggers ─────────────────────────────────────────────────────────────────
on:
  # Ejecución mensual automática: primer día de cada mes a las 06:00 UTC
  schedule:
    - cron: "0 6 1 * *"

  # Ejecución manual desde la pestaña Actions de GitHub
  workflow_dispatch:
    inputs:
      force_reestimate:
        description: "Forzar re-estimación aunque los datos no cambien"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

# ── Permisos ──────────────────────────────────────────────────────────────────
permissions:
  contents: write   # para hacer git push con los datos actualizados

# Evita que dos corridas se solapen (no cancela una en curso)
concurrency:
  group: actualizar-datos
  cancel-in-progress: false

# ── Jobs ─────────────────────────────────────────────────────────────────────
jobs:
  update:
    name: Scrape + NAIRU + PIB Potencial + tablero
    runs-on: ubuntu-latest
    timeout-minutes: 60   # la estimación MLE puede tomar ~5 min

    steps:
      # 1. Clonar el repositorio (incluye data/processed/ cacheado)
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historial completo para el push

      # 2. Python 3.11
      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # 3. Dependencias (runtime desde pyproject.toml)
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # ── 4. SCRAPING RESILIENTE ───────────────────────────────────────
      # Cada fuente se descarga por separado. Si una falla (caída del DANE,
      # bloqueo de bots, hipo de FRED…), se deja un ::warning:: y el pipeline
      # SIGUE usando el último CSV cacheado en data/processed/. Así el tablero
      # se actualiza igual aunque alguna fuente esté caída ese día.
      #   NO se scrapea PWT (anual + bloquea bots → se actualiza a mano) ni
      #   PIB_USA (era una muestra). Ambos quedan con su CSV committeado.
      - name: Scrape fuentes (resiliente)
        run: |
          scrape () {
            echo "──────── src.main $* ────────"
            if python -m src.main "$@"; then
              echo "✓ $* OK"
            else
              echo "::warning title=Scrape fallido::'src.main $*' falló — se usa el dato cacheado en data/processed/"
            fi
          }
          scrape --unemployment   # DANE GEIH (TD, TGP, PET)
          scrape --ipc            # DANE IPC
          scrape --informality    # DANE informalidad
          scrape --dane-gdp       # DANE PIB trimestral
          scrape --investment     # DANE FBKF (inversión)  → capital
          scrape --income         # DANE ingreso (RA/EBE/IM)
          scrape --andi           # ANDI EOIC (UCI, PDFs)
          scrape --banrep         # BANREP inflación (SUAMECA)
          scrape --tes            # BANREP TES Cero Cupón
          scrape --brent          # FRED Brent
          # NOTA: --viog-co NO se corre en automático. El filtro Kalman (UCM) de
          # VIOG-Colombia puede diverger con datos nuevos (dio un transitorio de
          # ~200% en 2005-Q1 al recomputar). El VIOG se mantiene estable desde su
          # CSV committeado (como PWT) y se regenera a mano + verificando.

      # ── 5. MODELO (sobre datos frescos o cacheados) ──────────────────
      # Estos pasos SÍ deben tener éxito: si el modelo falla no se publica
      # nada y el tablero queda con el último dato bueno.
      - name: Construir Data_NAIRU.xlsx
        run: python -m src.main --nairu-dataset

      - name: Estimar NAIRU / NAICU
        env:
          FORCE_REESTIMATE: ${{ github.event.inputs.force_reestimate || 'false' }}
        run: |
          if [ "$FORCE_REESTIMATE" = "true" ]; then
            rm -f outputs/nairu/nairu_colombia.csv   # fuerza re-estimación
          fi
          python -m src.main --nairu-estim

      - name: Merge dataset consolidado (resiliente)
        run: |
          python -m src.main --merge \
            || echo "::warning title=Merge::--merge falló; se conserva el nairu_dataset.csv cacheado"

      - name: PIB Potencial
        run: python -m src.main --pib-potencial   # PIB potencial Cobb-Douglas

      - name: Exportar datos al tablero
        run: python -m src.main --export-web    # docs/data/*.csv + meta.json

      # ── 6. Commit & push de datos frescos + tablero ──────────────────
      - name: Commit y push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/processed data/final docs/data

          if git diff --cached --quiet; then
            echo "Sin cambios — nada que commitear."
          else
            FECHA=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "chore(data): actualización automática ${FECHA} [skip ci]"

            # El árbol queda con archivos intermedios regenerados que NO se commitean
            # (Data_NAIRU.xlsx, PIB_CO.xlsx); se descartan para que un eventual rebase
            # no falle por "unstaged changes".
            git checkout -- . || true

            # Push directo; si la rama avanzó en el remoto durante la corrida, integrar
            # (rebase) y reintentar. ${GITHUB_REF_NAME} = rama actual (sandbox o main).
            git push origin "HEAD:${GITHUB_REF_NAME}" || {
              echo "push rechazado — integrando cambios remotos y reintentando…"
              git pull --rebase origin "${GITHUB_REF_NAME}"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            }
          fi
