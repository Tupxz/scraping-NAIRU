name: Tests

on:
  push:
    branches: ["main", "sandbox"]
  pull_request:
    branches: ["main", "sandbox"]
  workflow_dispatch:  # permite disparar el workflow manualmente desde la UI

# Cancela ejecuciones obsoletas en el mismo branch/PR cuando se hace un push nuevo
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install package + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        run: pytest tests/ -v --tb=short

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install ruff
        run: pip install "ruff>=0.6,<1.0"

      - name: Lint check
        run: ruff check src/ tests/
        continue-on-error: true  # informativo por ahora; pasar a estricto cuando esté limpio

      - name: Format check
        run: ruff format --check src/ tests/
        continue-on-error: true
