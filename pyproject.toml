[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scraping-nairu"
version = "0.1.0"
description = "Pipeline de datos reproducible para construir la base empírica de la NAIRU en Colombia"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Luisca Tupaz" },
]
keywords = ["nairu", "macroeconomics", "colombia", "dane", "banrep", "scraping", "output-gap"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

# ── Runtime: lo mínimo para correr los pipelines ─────────────────────
dependencies = [
    # Core de datos
    "pandas>=2.1,<3.0",
    "numpy>=1.26,<2.0",
    "requests>=2.31,<3.0",
    # Lectura/escritura de archivos
    "openpyxl>=3.1,<4.0",          # Excels del DANE
    "beautifulsoup4>=4.12,<5.0",   # Scraping HTML
    "lxml>=5.0,<6.0",              # Parser HTML rápido
    "pdfplumber>=0.11,<1.0",       # Extracción de PDFs (ANDI EOIC)
    # Filtros y modelos econométricos (VIOG)
    "scipy>=1.11,<2.0",            # Filtro Butterworth
    "statsmodels>=0.14,<1.0",      # BK, CF, HP, Kalman/UCM
    # Visualización del pipeline VIOG
    "matplotlib>=3.8,<4.0",
]

[project.optional-dependencies]
# Para desarrollo y testing
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.6,<1.0",
]

# Para análisis exploratorio en notebooks
notebooks = [
    "jupyter>=1.0",
    "ipykernel>=6.0",
    "seaborn>=0.13",
]

# Conjunto completo (dev + notebooks) para contribuidores
all = [
    "scraping-nairu[dev,notebooks]",
]

[project.urls]
Repository = "https://github.com/luisca/scraping-NAIRU"

[project.scripts]
nairu = "src.main:main"

# ── Configuración de herramientas ────────────────────────────────────

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "-q",
    "--strict-markers",
    "--tb=short",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["andi_agent", "notebooks"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (orden de imports)
    "B",    # bugbear
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line too long (gestionado por formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]
